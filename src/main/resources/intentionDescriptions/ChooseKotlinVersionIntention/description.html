Sets the <code>kotlin.version</code> property of a <code>pom.xml</code> from a list of Kotlin versions, grouped as
<code>dev</code>, <code>experimental</code> and Maven Central, newest first. Typing filters the list. <code>dev</code>
and <code>experimental</code> builds need their repository, which <em>QA Helpers | Configure Repositories</em> adds.
